<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurable | The Mind. Unlocked.</title>

    <!-- css + js -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- icon -->
    <link rel="icon" type="image/jpg" href="icon.jpg">

    <!-- font imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="medium">
        <h1>Neurable</h1>

        <!-- nav links -->
        <nav class="navlink">
            <a href="index.html#home">Home</a>
            <a href="index.html#product">Product</a>
            <a href="About_US.html">Company</a>
            <a href="Contact.html">Contact</a>
            <a href="Join.html">Join</a>
        </nav>
    </header>

    <section id="contact">

        <!-- top banner -->
        <section class="contactbg">
            <div>
                <h2 class="contactb">Let’s connect.</h2>
                <p class="contacts">Want to chat? Let us know how we can help.</p>
            </div>
        </section>

        <div class="contactsec">
        <div class="centext">

            <h2>Customer Support</h2>

            <!-- form starting here -->
            <form>

            <div class="row">
                <div class="field">
                    <label>First name*</label><br>
                    <input type="text" required> <!-- required field -->
                </div>

                <div class="field">
                    <label>Last name*</label><br>
                    <input type="text" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Email*</label><br>
                    <input type="email" required> <!-- email validation -->
                </div>

                <div class="field">
                    <label>Phone number*</label><br>
                    <input type="tel" required pattern="[0-9]{10,}"> <!-- only numbers -->
                </div>
            </div>

            <div class="field">
                <label>Message*</label><br>
                <textarea name="message" required placeholder="Type your message here..."></textarea>
                <br><br>
            </div>

            <!-- file upload -->
            <div>
                <label class="upload">File or image upload</label><br>
                <input id="uploadbtn" type="file" accept="image/*"> <!-- images only -->
                <br>
            </div>

            <div>
                <button class="csbtn" type="submit">Submit</button> <!-- submit buton -->
                <br><br><br>
            </div>    

            </form>

        </div>
        </div>
    </section>

</body>
</html>
