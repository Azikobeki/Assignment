<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- css + js -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- icon -->
    <link rel="icon" type="image/jpg" href="icon.jpg">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="medium">
        <h1>Neurable</h1>

        <!-- nav -->
        <nav class="navlink">
            <a href="Main.html#home">Home</a>
            <a href="Main.html#product">Product</a>
            <a href="About_US.html">Company</a>
            <a href="Contact.html">Contact</a>
            <a href="Join.html">Join</a>
        </nav>
    </header>

    <section id="join">
        <div class="container2">

        <!-- right side for form -->
        <div class="side-r">
            <div>
                <h2>Join us today</h2>
                <p>Be part of a world where your mind works seamlessly with technology.</p>
            </div>
           
            <!-- signup form -->
            <form>

            <div class="field">
                <label>First & Last names*</label><br>
                <input type="text" required minlength="3"> <!-- min 3 chars -->
            </div>

            <div class="field">
                <label>Email*</label><br>
                <input type="email" required> <!-- email format -->
            </div>

            <div class="field">
                <label>Password*</label><br>
                <input type="password" required minlength="8"> <!-- min length -->
                <br><br>
            </div>

            <div>
                <button class="joinbtn" type="submit">Submit</button> <!-- submit btn -->
            </div>

            </form>
         </div>

        <!-- left side design for pricture -->
        <div class="side-l">
        </div>

        <br><br><br> <!-- spacing -->
        </div>
    
    </section>

</body>
